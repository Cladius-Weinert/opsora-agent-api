# ==============================================================================
# Opsora Agent API — Nginx Reverse Proxy Configuration
# Domain: api.opsora.id → localhost:8080
# Features: SSL (Let's Encrypt), rate limiting, gzip, security headers,
#           WebSocket/SSE support, CORS
# ==============================================================================

# --- Rate limiting zone ---
# 10 MB shared memory zone, 100 requests/minute per client IP
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=100r/m;

# --- Upstream backend ---
upstream opsora_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name api.opsora.id;

    # Allow certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.opsora.id;

    # ---- SSL certificates (Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/api.opsora.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.opsora.id/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        text/event-stream
        application/xml;

    # ---- Security headers ----
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- CORS headers ----
    # Adjust the allowed origins to match your frontend domains
    set $cors_origin "https://opsora.id";

    # Allow multiple origins (add more as needed)
    if ($http_origin ~* "(https://(www\.)?opsora\.id|https://(www\.)?opsora\.ai)") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    add_header Access-Control-Max-Age 86400 always;

    # Handle preflight OPTIONS requests
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Max-Age 86400;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # ---- Rate limiting ----
    # Burst 20 requests without delay, then reject excess
    limit_req zone=api_rate_limit burst=20 nodelay;
    limit_req_status 429;

    # ---- Request size limit ----
    client_max_body_size 10m;

    # ---- Proxy timeouts ----
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---- WebSocket / SSE support (streaming) ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;           # critical for SSE streaming
    proxy_cache off;

    # ---- Proxy headers ----
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # ---- API routes ----
    location / {
        proxy_pass http://opsora_backend;
    }

    # ---- Health check endpoint (exempt from rate limiting) ----
    location = /health {
        limit_req zone=api_rate_limit burst=50 nodelay;
        proxy_pass http://opsora_backend;
        access_log off;
    }

    # ---- Static files (landing page & docs) ----
    location = / {
        # Serve the API by default; static pages are on separate domains/paths
        proxy_pass http://opsora_backend;
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ---- Logging ----
    access_log /var/log/nginx/opsora-api-access.log;
    error_log  /var/log/nginx/opsora-api-error.log warn;
}
