# ==============================================================================
# Opsora Agent API — CI/CD Pipeline
# Triggers: push to main
# Steps: build → push to GHCR → deploy to VPS via SSH → health check
# ==============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opsora-agent-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ------------------------------------------------------------------
  # Build & push Docker image to GitHub Container Registry
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Deploy to VPS via SSH
  # ------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            # Login to GHCR so docker pull works for private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            cd /opt/opsora-agent-api || exit 1

            # Pull the new image
            docker compose pull opsora-agent-api

            # Stop the old container, start the new one
            docker compose up -d --remove-orphans opsora-agent-api

            # Prune dangling images to free disk space
            docker image prune -f

            # Wait for the container to become healthy (max 60s)
            echo "Waiting for container to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' opsora-agent-api 2>/dev/null || echo "missing")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Container is healthy!"
                exit 0
              fi
              echo "  attempt $i/12 — status: $STATUS"
              sleep 5
            done

            # If we reach here, the container never became healthy
            echo "❌ Container failed health check after 60s"
            docker logs --tail 50 opsora-agent-api

            # Rollback to previous image
            echo "🔄 Rolling back to previous image..."
            docker compose up -d --force-recreate opsora-agent-api
            exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Post-deploy health check (runs on GitHub runner, hits the public URL)
  # ------------------------------------------------------------------
  health-check:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Run external health check
        run: |
          echo "Checking https://api.opsora.id/health ..."
          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.opsora.id/health || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  attempt $i/6 — HTTP $HTTP_CODE"
            sleep 5
          done
          echo "❌ Health check failed after 30s"
          exit 1
