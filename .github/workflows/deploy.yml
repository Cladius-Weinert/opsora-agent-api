# ==============================================================================
# Opsora Agent API — CI/CD Pipeline (Fly.io)
# Triggers: push to main
# Steps: build → deploy to Fly.io → health check
# ==============================================================================

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  health-check:
    name: Post-deploy health check
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Run external health check
        run: |
          APP_URL="https://opsora-agent-api.fly.dev/health"
          echo "Checking $APP_URL ..."
          for i in $(seq 1 8); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$APP_URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "  attempt $i/8 — HTTP $HTTP_CODE"
            sleep 5
          done
          echo "❌ Health check failed after 40s"
          exit 1
