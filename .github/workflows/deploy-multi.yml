# ==============================================================================
# Opsora Agent API — Multi-Platform CI/CD Pipeline
# Deploys to: Render (API), Vercel (Dashboard), Cloudflare (Edge)
# Triggers: push to main
# ==============================================================================

name: Deploy Multi-Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Render: API auto-deploys from GitHub, we verify health
  # ------------------------------------------------------------------
  verify-render:
    name: Verify Render Deployment
    runs-on: ubuntu-latest
    if: ${{ vars.RENDER_ENABLED == 'true' }}
    steps:
      - name: Wait for Render deploy
        run: sleep 60  # Render takes ~60s to deploy

      - name: Health check
        run: |
          API_URL="${{ vars.RENDER_API_URL || 'https://opsora-agent-api.onrender.com' }}"
          echo "Checking $API_URL/health ..."
          for i in $(seq 1 10); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_URL/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Render API healthy (HTTP $HTTP_CODE)"
              curl -s "$API_URL/health" | python3 -m json.tool
              exit 0
            fi
            echo "  attempt $i/10 — HTTP $HTTP_CODE (waiting 10s...)"
            sleep 10
          done
          echo "❌ Render API unhealthy after 100s"
          exit 1

  # ------------------------------------------------------------------
  # Cloudflare: Deploy Workers
  # ------------------------------------------------------------------
  deploy-cloudflare:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
    needs: verify-render
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Workers
        working-directory: cloudflare
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # ------------------------------------------------------------------
  # Vercel: Dashboard auto-deploys from GitHub
  # ------------------------------------------------------------------
  verify-vercel:
    name: Verify Vercel Dashboard
    runs-on: ubuntu-latest
    if: ${{ vars.VERCEL_ENABLED == 'true' }}
    needs: verify-render
    steps:
      - name: Wait for Vercel deploy
        run: sleep 30

      - name: Health check
        run: |
          DASHBOARD_URL="${{ vars.VERCEL_DASHBOARD_URL || 'https://opsora-dashboard.vercel.app' }}"
          echo "Checking $DASHBOARD_URL ..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$DASHBOARD_URL" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Vercel Dashboard healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Vercel Dashboard returned HTTP $HTTP_CODE"
          fi

  # ------------------------------------------------------------------
  # Elastic Cloud: Sync usage data
  # ------------------------------------------------------------------
  sync-elastic:
    name: Sync to Elastic Cloud
    runs-on: ubuntu-latest
    if: ${{ vars.ELASTIC_ENABLED == 'true' }}
    needs: verify-render
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync usage to Elastic
        run: python scripts/sync-usage-to-elastic.py
        env:
          ELASTIC_CLOUD_API_KEY: ${{ secrets.ELASTIC_CLOUD_API_KEY }}
          ELASTIC_ENDPOINT: ${{ vars.ELASTIC_ENDPOINT }}
          RENDER_API_URL: ${{ vars.RENDER_API_URL || 'https://opsora-agent-api.onrender.com' }}
          OPSORA_API_TOKEN: ${{ secrets.OPSORA_API_TOKEN }}

  # ------------------------------------------------------------------
  # Final: Report deployment status
  # ------------------------------------------------------------------
  report:
    name: Deployment Report
    runs-on: ubuntu-latest
    needs: [verify-render, deploy-cloudflare, verify-vercel, sync-elastic]
    if: always()
    steps:
      - name: Report
        run: |
          echo "## 🚀 Multi-Platform Deployment Report"
          echo ""
          echo "| Platform | Status |"
          echo "|----------|--------|"
          echo "| Render (API) | ${{ needs.verify-render.result == 'success' && '✅' || '⚠️ Skipped' }} |"
          echo "| Cloudflare (Edge) | ${{ needs.deploy-cloudflare.result == 'success' && '✅' || '⚠️ Skipped' }} |"
          echo "| Vercel (Dashboard) | ${{ needs.verify-vercel.result == 'success' && '✅' || '⚠️ Skipped' }} |"
          echo "| Elastic (Search) | ${{ needs.sync-elastic.result == 'success' && '✅' || '⚠️ Skipped' }} |"
