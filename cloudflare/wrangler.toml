# Opsora Agent API — Cloudflare Workers Config
name = "opsora-edge"
main = "worker.js"
compatibility_date = "2026-07-30"

# KV Namespace for config/usage caching
[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Environment variables
[vars]
API_ORIGIN = "https://opsora-agent-api.onrender.com"

# Routes (configure after deployment)
# routes = [
#   { pattern = "api.opsora.id/*", zone_name = "opsora.id" }
# ]

# Cron trigger for health monitoring (every 5 minutes)
[triggers]
crons = ["*/5 * * * *"]
